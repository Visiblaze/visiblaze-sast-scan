#
# Visiblaze — scan your source for vulnerabilities
#
# ── What this does, and what leaves your network ──
#
# The scan runs on YOUR runner, against the checkout that is already there. Your source code is
# never uploaded. What leaves is a findings report: rule id, severity, file path, line numbers,
# and — where the analysis found one — the source-to-sink data flow within a single file. Those
# are locations in your code, not your code.
#
# It reads. It does not write, comment, annotate, or open pull requests. The only thing it can do
# to your pipeline is set an exit code, and only if you ask it to with `fail-on`.
#
# ── There is no secret to configure ──
#
# Authentication is GitHub's own OIDC. The workflow needs `permissions: id-token: write`, and the
# action mints a token that lives for minutes and states cryptographically which repository
# produced it. Nothing is stored in your repository secrets, so there is nothing to rotate, leak
# or revoke — and a token captured from a log cannot be replayed against another tenant.
#
# Your Visiblaze admin authorises your org or repo once, on our side. Until they do, this action
# gets a 403 and says so.
#
# ── Every binary it runs is pinned and digest-verified ──
#
# This action downloads two executables onto your runner. Both are pinned to an exact version in
# pins.env and both have their SHA-256 checked BEFORE execution; a mismatch aborts and runs
# nothing. There is no "latest" anywhere, because a floating dependency inside a pinned action
# would mean the SHA you pinned does not actually determine what runs on your machine.
#
# ── Composite, not Docker, on purpose ──
#
# A Docker action would mean trusting an image you cannot read. This is a shell script you can
# review, running on your own runner. For a tool that reads all of your source, readable beats
# convenient.
name: Visiblaze SAST
description: Scan your source for vulnerabilities on your own runner and send only the findings to Visiblaze. Your code never leaves your network.
author: Visiblaze

branding:
  icon: shield
  color: blue

inputs:
  tenant:
    description: Your Visiblaze tenant id. Required — findings posted against the wrong tenant are not recoverable by re-running.
    required: true
  api-url:
    description: >-
      Your Visiblaze ingest endpoint. Required — we give you the exact URL when your organisation
      is authorised, because it depends on which region your tenant lives in.
    required: true
  repo-key:
    description: >-
      The Visiblaze repository key, "github#<numeric repo id>". Defaults to the id of the
      repository running the workflow, which is correct unless you are deliberately reporting on
      behalf of another repository — and the server rejects that, so the default is what you want.
    required: false
    default: ""
  path:
    description: >-
      Directory to scan, relative to the workspace. Defaults to the whole checkout. In a monorepo,
      point one job per package at its own directory — the action then DECLARES that directory as
      its coverage, so several jobs on one repository stop resolving each other's findings.
    required: false
    default: "."
  scope:
    description: >-
      Override the declared coverage: a comma-separated list of repository-relative paths this run
      covered. Only needed when one job scans several non-adjacent directories, since `path` is
      declared automatically. Getting this WRONG is worse than leaving it empty — a scope narrower
      than what you scanned means real fixes are never marked resolved.
    required: false
    default: ""
  fail-on:
    description: >-
      Fail the job when a finding at or above this severity is present: critical, high, medium or
      low. Empty by default, and that default is deliberate — a repository with existing debt would
      otherwise be permanently red, and a check that can never go green is one people route around.
      Findings are still reported when this is empty.
    required: false
    default: ""
  rules-version:
    description: >-
      Pin the rule pack to an exact version, e.g. `v0.1.0`. Leave empty (the default) to use
      whatever Visiblaze currently serves.

      Unpinned, the same commit can produce different findings on different days as the rule pack
      improves. That is usually what you want; it is not what you want for a check that gates
      merges, where a verdict should be reproducible.

      Pinned, the scanner refuses to run if that version cannot be served. It will not quietly fall
      back to the rules built into the binary, because a pin whose failure mode is "ran different
      rules and said nothing" is not a pin.
    required: false
    default: ""
  mode:
    description: >-
      `advisory` (default) or `gate`.

      In ADVISORY mode a broken scan is reported and the job still succeeds: a scanner outage must
      not be the reason a deploy pipeline goes red, and this is the right default for a check
      nobody is gating on yet.

      In GATE mode a broken scan FAILS the job. Use it wherever this check is required in branch
      protection, because there the two states are not equivalent: no SAST result is not a SAST
      pass, and a check that goes green when the scanner crashed is worse than no check at all -
      it asserts something.

      An unrecognised value is refused rather than treated as advisory, so a typo cannot silently
      downgrade a gate.
    required: false
    default: advisory
  fail-on-error:
    description: >-
      Fail the job if the scan or the upload itself fails. Default false: a scanner outage must not
      be the reason a deploy pipeline goes red. Set true if you would rather know loudly. This is
      independent of `fail-on`, which is about your code rather than about this tool.
    required: false
    default: "false"
  dry-run:
    description: Scan and print what would be sent, upload nothing. Use this for the first run so you can read exactly what leaves.
    required: false
    default: "false"

outputs:
  findings:
    description: Number of findings reported.
    value: ${{ steps.scan.outputs.findings }}
  status:
    description: One of sent, dry-run, failed.
    value: ${{ steps.scan.outputs.status }}
  policy:
    description: One of pass, fail, not-applied — whether `fail-on` was met.
    value: ${{ steps.scan.outputs.policy }}
  critical:
    description: Number of critical-severity findings.
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: Number of high-severity findings.
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: Number of medium-severity findings.
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: Number of low-severity findings.
    value: ${{ steps.scan.outputs.low }}
  scanner-version:
    description: >-
      Version of the Visiblaze scanner that produced this result. Recorded so a change in
      finding counts can be attributed to a scanner upgrade rather than to your code.
    value: ${{ steps.scan.outputs.scanner-version }}
  rules-version:
    description: >-
      Version of the Visiblaze rule pack used. Separate from `scanner-version` because rules
      change far more often than the engine does.
    value: ${{ steps.scan.outputs.rules-version }}
  scan-status:
    description: >-
      `complete` or `partial`. A partial run's findings are real, but its SILENCE is not
      evidence — do not read an absent finding as a clean result. Distinct from `status`,
      which reports what this ACTION did (sent, dry-run, failed).
    value: ${{ steps.scan.outputs.scan-status }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        VISIBLAZE_TENANT: ${{ inputs.tenant }}
        VISIBLAZE_API: ${{ inputs.api-url }}
        IN_REPO_KEY: ${{ inputs.repo-key }}
        IN_PATH: ${{ inputs.path }}
        IN_SCOPE: ${{ inputs.scope }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        IN_MODE: ${{ inputs.mode }}
        IN_RULES_VERSION: ${{ inputs.rules-version }}
        DRY_RUN: ${{ inputs.dry-run }}
        # The pull request's base commit, from the event payload rather than an API call. Empty on
        # a push, which is correct: a push has no proposed change to be new relative to.
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The base BRANCH, as a fallback fetch target: some servers refuse to serve an arbitrary
        # commit but will serve the ref it sits on.
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        GH_REPO_ID: ${{ github.event.repository.id }}
        GH_REPOSITORY: ${{ github.repository }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -uo pipefail

        # Soft failure unless the caller opted in. Two exit paths so the intent is explicit
        # rather than buried in a trailing `|| true`.
        # Resolved before anything can fail, because bail() consults it.
        #
        # An unknown value is a hard error rather than a fallback to advisory. Falling back would
        # mean `mode: Gate`, `mode: blocking` or `mode: gated` silently produce a check that
        # cannot fail - the exact outcome the person writing that line was trying to prevent, and
        # invisible to them because the job goes green either way.
        case "${IN_MODE:-advisory}" in
          advisory) FAIL_CLOSED="false" ;;
          gate)     FAIL_CLOSED="true" ;;
          *)
            echo "::error::visiblaze-sast: mode must be 'advisory' or 'gate', got '${IN_MODE}'"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
            ;;
        esac
        # fail-on-error predates mode and still works on its own, so an existing workflow that set
        # it keeps the behaviour it asked for. Either switch failing closed is enough.
        if [ "${FAIL_ON_ERROR}" = "true" ]; then FAIL_CLOSED="true"; fi

        bail() {
          local level="$1"; shift
          echo "::${level}::visiblaze-sast: $*"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          if [ "${FAIL_CLOSED}" = "true" ]; then exit 1; fi
          exit 0
        }

        # ── The pin, and the refusal to run without it ────────────────────────────────────
        #
        # Sourced rather than inlined so a version bump is a one-file diff with the digest
        # visibly moving alongside the URL. `set -a` exports each KEY=value.
        PINS="${ACTION_DIR}/pins.env"
        [ -f "$PINS" ] || bail error "pins.env is missing from the action directory — refusing to download anything unpinned"
        set -a
        # shellcheck disable=SC1090
        . "$PINS"
        set +a

        case "$(uname -m)" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) bail error "unsupported runner architecture $(uname -m); Visiblaze SAST publishes linux/amd64 and linux/arm64" ;;
        esac
        if [ "$(uname -s)" != "Linux" ]; then
          bail error "unsupported runner OS $(uname -s); Visiblaze SAST publishes Linux builds only"
        fi

        case "$ARCH" in
          amd64) OPENGREP_URL="${OPENGREP_URL_LINUX_AMD64}"; OPENGREP_SHA="${OPENGREP_SHA256_LINUX_AMD64}" ;;
          arm64) OPENGREP_URL="${OPENGREP_URL_LINUX_ARM64}"; OPENGREP_SHA="${OPENGREP_SHA256_LINUX_ARM64}" ;;
        esac

        # Fails closed on an unpopulated pin. This is what makes it impossible to ship or run this
        # action with an unverified dependency: the sentinel is the committed default, so the
        # action is inert until someone deliberately records a real version and digest.
        for pair in "OPENGREP_VERSION=${OPENGREP_VERSION}" "SCANNER_VERSION=${SCANNER_VERSION}" \
                    "SCANNER_BASE_URL=${SCANNER_BASE_URL}" \
                    "OPENGREP_URL=${OPENGREP_URL}" "OPENGREP_SHA256=${OPENGREP_SHA}"; do
          if [ "${pair#*=}" = "UNSET" ] || [ -z "${pair#*=}" ]; then
            bail error "${pair%%=*} is not pinned in pins.env (still UNSET). This action refuses to download an unpinned binary — see the instructions in pins.env."
          fi
        done

        WORK="$(mktemp -d)"
        trap 'rm -rf "$WORK"' EXIT

        # verify_sha256 is the gate every downloaded executable passes before it is made
        # executable, let alone run. Uses sha256sum where present and shasum otherwise, because
        # self-hosted runners are not all the GitHub image.
        verify_sha256() {
          local file="$1" expected="$2" actual=""
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$file" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            actual="$(shasum -a 256 "$file" | awk '{print $1}')"
          else
            bail error "no sha256sum or shasum on this runner — cannot verify a download, so nothing will be executed"
          fi
          # Lowercased both sides: a digest pasted from a release page is often uppercase, and a
          # case mismatch must not read as tampering.
          if [ "$(printf '%s' "$actual" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$expected" | tr 'A-Z' 'a-z')" ]; then
            bail error "checksum mismatch for $(basename "$file") — expected ${expected}, got ${actual}. Nothing was executed. Either the pin is stale or the artefact changed; do not 'fix' this by updating the digest without finding out which."
          fi
        }

        # ── Opengrep: the analysis engine ────────────────────────────────────────────────
        echo "visiblaze-sast: fetching opengrep ${OPENGREP_VERSION} (${ARCH})"
        if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/opengrep" "${OPENGREP_URL}"; then
          bail error "could not download opengrep from ${OPENGREP_URL}"
        fi
        verify_sha256 "${WORK}/opengrep" "${OPENGREP_SHA}"

        # ── Provenance, on top of integrity ──────────────────────────────────────────────
        #
        # The digest above proves these bytes are the ones we recorded. It cannot prove we
        # recorded the right ones: a digest taken from a compromised release is matched
        # faithfully forever. Opengrep signs each asset with Sigstore keyless signing, so we
        # also check WHO published it.
        #
        # --certificate-identity is not optional. `cosign verify-blob` without it accepts any
        # valid Sigstore signature, including one an attacker minted for a repository they
        # control — the signature would verify and mean nothing. Pinning identity and issuer
        # is what makes this a statement about Opengrep rather than about cryptography.
        case "${ARCH}" in
          amd64) COSIGN_URL="${COSIGN_URL_LINUX_AMD64}"; COSIGN_SHA="${COSIGN_SHA256_LINUX_AMD64}" ;;
          arm64) COSIGN_URL="${COSIGN_URL_LINUX_ARM64}"; COSIGN_SHA="${COSIGN_SHA256_LINUX_ARM64}" ;;
        esac
        for pair in "COSIGN_URL=${COSIGN_URL}" "COSIGN_SHA256=${COSIGN_SHA}" \
                    "OPENGREP_CERT_IDENTITY=${OPENGREP_CERT_IDENTITY}" \
                    "OPENGREP_CERT_OIDC_ISSUER=${OPENGREP_CERT_OIDC_ISSUER}"; do
          if [ "${pair#*=}" = "UNSET" ] || [ -z "${pair#*=}" ]; then
            bail error "${pair%%=*} is not pinned in pins.env. Signature verification cannot be skipped by leaving it blank — fill it in or remove the dependency."
          fi
        done

        # NETWORK REQUIREMENT, and it is a real adoption constraint rather than a footnote:
        # keyless verification consults Sigstore's transparency log at rekor.sigstore.dev. A
        # runner behind a TLS-intercepting proxy gets the proxy's certificate for that host
        # and verification fails — observed on an ISP that MITMs it outright. GitHub-hosted
        # runners are fine. A self-hosted runner inside a corporate network may not be, and
        # the failure is fail-closed: the action refuses rather than skipping the check. If a
        # customer hits this, the answer is to allow rekor.sigstore.dev through unintercepted,
        # never to relax the verification.
        #
        # FLAG DEPRECATION: cosign v3 deprecates --certificate/--signature in favour of
        # --bundle. Opengrep publishes .cert and .sig rather than a bundle, so the deprecated
        # form is the only one available to us. When bumping COSIGN_VERSION, check these flags
        # still exist; a major that removes them breaks this step closed, not open.
        echo "visiblaze-sast: verifying the opengrep signature"
        if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/cosign" "${COSIGN_URL}"; then
          bail error "could not download cosign from ${COSIGN_URL} — the opengrep signature cannot be checked, so nothing will be executed"
        fi
        verify_sha256 "${WORK}/cosign" "${COSIGN_SHA}"
        chmod +x "${WORK}/cosign"

        # .cert and .sig sit beside the binary, named after it.
        for ext in cert sig; do
          if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/opengrep.${ext}" "${OPENGREP_URL}.${ext}"; then
            bail error "could not download ${OPENGREP_URL}.${ext} — refusing to run an unverified binary"
          fi
        done
        # The published .cert is base64-wrapped PEM; cosign wants the PEM.
        if ! base64 -d "${WORK}/opengrep.cert" > "${WORK}/opengrep.pem" 2>/dev/null; then
          cp "${WORK}/opengrep.cert" "${WORK}/opengrep.pem"
        fi

        if ! "${WORK}/cosign" verify-blob \
              --certificate "${WORK}/opengrep.pem" \
              --signature "${WORK}/opengrep.sig" \
              --certificate-identity "${OPENGREP_CERT_IDENTITY}" \
              --certificate-oidc-issuer "${OPENGREP_CERT_OIDC_ISSUER}" \
              "${WORK}/opengrep" >/dev/null 2>&1; then
          bail error "opengrep signature verification FAILED. The digest matched but the signature did not verify against ${OPENGREP_CERT_IDENTITY}. Either the pinned identity is stale (upstream moved its release workflow) or these are not the bytes upstream published. Do not proceed by relaxing this check; find out which."
        fi
        echo "visiblaze-sast: opengrep signature verified (${OPENGREP_CERT_IDENTITY})"

        chmod +x "${WORK}/opengrep"

        # ── The Visiblaze scanner ────────────────────────────────────────────────────────
        #
        # Two files from our own release: the archive and the checksums manifest published beside
        # it. The manifest is fetched from the same pinned tag rather than trusted from anywhere
        # else, which is why the scanner needs no digest in pins.env — the tag pins both.
        SCANNER_TGZ="visiblaze-scan_${SCANNER_VERSION}_linux_${ARCH}.tar.gz"
        BASE="${SCANNER_BASE_URL%/}/${SCANNER_VERSION}"
        echo "visiblaze-sast: fetching scanner ${SCANNER_VERSION} (${ARCH})"
        if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/${SCANNER_TGZ}" "${BASE}/${SCANNER_TGZ}"; then
          bail error "could not download ${SCANNER_TGZ} from ${BASE}"
        fi
        # The digest comes from pins.env, NOT from the release.
        #
        # It used to be read out of the release's own checksums.txt, which defends against a
        # corrupted download and not against a compromised release: whoever can replace the
        # archive can replace the file that vouches for it. Committing the digest here moves the
        # trust anchor into the action commit, so a pinned action SHA really does determine the
        # bytes that execute - which is what the README claims.
        case "${ARCH}" in
          amd64) EXPECTED="${SCANNER_SHA256_LINUX_AMD64:-}" ;;
          arm64) EXPECTED="${SCANNER_SHA256_LINUX_ARM64:-}" ;;
          *)     EXPECTED="" ;;
        esac
        # Refused rather than falling back to the release's checksums.txt. A missing pin is the
        # one condition under which a fallback would silently restore exactly the weakness this
        # replaced, on a run that otherwise looks identical.
        [ -n "$EXPECTED" ] || bail error "pins.env carries no scanner digest for ${ARCH} — refusing to run a scanner this action commit does not pin"
        verify_sha256 "${WORK}/${SCANNER_TGZ}" "$EXPECTED"

        if ! tar -xzf "${WORK}/${SCANNER_TGZ}" -C "${WORK}"; then
          bail error "could not extract ${SCANNER_TGZ}"
        fi
        [ -f "${WORK}/visiblaze-scan" ] || bail error "${SCANNER_TGZ} did not contain visiblaze-scan"
        chmod +x "${WORK}/visiblaze-scan"

        # ── Identity ─────────────────────────────────────────────────────────────────────
        #
        # repo-key defaults to THIS repository's numeric id. The numeric id rather than the name
        # because a rename keeps the id, and the server joins on it.
        REPO_KEY="${IN_REPO_KEY}"
        if [ -z "$REPO_KEY" ]; then
          [ -n "${GH_REPO_ID}" ] || bail error "could not determine this repository's numeric id; set repo-key explicitly"
          REPO_KEY="github#${GH_REPO_ID}"
        fi

        SCAN_DIR="${GITHUB_WORKSPACE}"
        if [ -n "${IN_PATH}" ] && [ "${IN_PATH}" != "." ]; then
          SCAN_DIR="${GITHUB_WORKSPACE}/${IN_PATH#./}"
        fi
        [ -d "$SCAN_DIR" ] || bail error "path '${IN_PATH}' does not exist in the checkout — did an earlier step forget actions/checkout?"

        # The scan must stay inside the checkout, and string-building the path does not ensure it.
        # `path: ../..` produces a directory that exists and is somebody else's — on a hosted runner
        # that is the runner's own workspace root, and on a SELF-HOSTED runner it is whatever else
        # that machine happens to hold, including other tenants' checkouts and credentials.
        #
        # Compared after resolution, so a symlink inside the checkout pointing outward is caught by
        # the same test as `..`. Both operands are canonicalised: comparing a resolved path against
        # an unresolved one fails on any runner whose workspace sits under a symlink, which is the
        # default on macOS.
        WORKSPACE_REAL="$(cd "${GITHUB_WORKSPACE}" 2>/dev/null && pwd -P)" || bail error "could not resolve GITHUB_WORKSPACE"
        SCAN_REAL="$(cd "${SCAN_DIR}" 2>/dev/null && pwd -P)" || bail error "could not resolve path '${IN_PATH}'"
        case "${SCAN_REAL}" in
          "${WORKSPACE_REAL}"|"${WORKSPACE_REAL}"/*) ;;
          *) bail error "path '${IN_PATH}' resolves to ${SCAN_REAL}, which is outside the checkout — refusing to read files this workflow did not check out" ;;
        esac
        SCAN_DIR="${SCAN_REAL}"

        ARGS=(
          --dir "$SCAN_DIR"
          --repo-key "$REPO_KEY"
          --tenant "$VISIBLAZE_TENANT"
          --opengrep "${WORK}/opengrep"
        )
        # Scope is left to the scanner to DERIVE from --dir against GITHUB_WORKSPACE unless the
        # caller overrides it. Deriving beats restating: the job already said what it covers by
        # choosing a path, and a hand-written scope is a second chance to say it wrong.
        if [ -n "${IN_SCOPE}" ]; then
          # Scope is a comma-separated list of repo-relative directories. It is a DECLARATION of
          # coverage rather than a path the action opens, but it reaches the platform and decides
          # which stored findings a run may resolve — so an entry escaping the repository would let
          # a run claim coverage it never had, and resolve findings it never looked at.
          OLD_IFS="$IFS"; IFS=','
          for entry in ${IN_SCOPE}; do
            case "${entry}" in
              /*|*..*) IFS="$OLD_IFS"; bail error "scope entry '${entry}' must be a relative path inside the repository" ;;
            esac
          done
          IFS="$OLD_IFS"
          ARGS+=(--scope "${IN_SCOPE}")
        fi
        [ -n "${IN_FAIL_ON}" ] && ARGS+=(--fail-on "${IN_FAIL_ON}")

        # --api is passed on BOTH paths, and --dry-run alone decides whether anything is
        # uploaded. The scanner computes `reporting := api != "" && !dryRun`, so "uploads
        # nothing" is unchanged.
        #
        # It is passed on a dry run because the scanner derives the RULE PACK url from it.
        # Passing it only on a reporting run meant a dry run silently analysed with the rules
        # compiled into the binary while a real run used the current ones — so the run this
        # action recommends you read first was previewing a different result from the one you
        # would get. Every published description of dry-run promises the opposite ("prints
        # exactly what would be sent"), and that promise was measurably false: the printed
        # envelope carries rule_pack_version, which differed between the two.
        #
        # An evaluator who supplies no api-url still contacts Visiblaze zero times — the
        # derivation yields nothing to fetch. For everyone else this adds ONE unauthenticated
        # GET to the rules route; the dry run still mints no token and still authenticates
        # nowhere.
        # ── Where findings may be sent ───────────────────────────────────────────────────
        #
        # Checked HERE, in the wrapper anyone can read, rather than left to the compiled scanner.
        # The guarantee worth being able to make is "this action can only send findings to a
        # Visiblaze origin", and a guarantee that lives inside a binary is one a reviewer has to
        # take on trust - which is the whole objection to a closed-source scanner.
        #
        # The allowlist is in pins.env, so it moves with the action SHA a customer pinned: adding
        # an origin is a visible diff in the same commit that changes what may execute.
        API_ORIGIN="$(printf '%s' "$VISIBLAZE_API" | awk -F/ '{print $1"//"$3}')"
        case "$VISIBLAZE_API" in
          https://*) ;;
          *) bail error "api-url must be https, got '${VISIBLAZE_API}'" ;;
        esac
        API_OK=""
        for ORIGIN in ${ALLOWED_API_ORIGINS:-}; do
          if [ "$API_ORIGIN" = "$ORIGIN" ]; then API_OK="yes"; break; fi
        done
        # No allowlist at all is refused rather than treated as "anything goes". An empty variable
        # is what a truncated or mis-sourced pins.env looks like, and defaulting it open would
        # turn a broken file into a silent removal of this check.
        [ -n "$API_OK" ] || bail error "api-url origin ${API_ORIGIN} is not one this action permits — findings may only be sent to a Visiblaze endpoint listed in pins.env"

        [ -n "${IN_RULES_VERSION}" ] && ARGS+=(--rules-version "${IN_RULES_VERSION}")

        ARGS+=(--api "$VISIBLAZE_API")
        if [ "${DRY_RUN}" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        # ── The baseline, on a pull request ──────────────────────────────────────────────
        #
        # Scanning the merge base as well as the head is what lets a finding be called NEW, and
        # therefore what lets your organisation's policy block on what this change introduced
        # rather than on everything the branch already had.
        #
        # Every failure below is NON-FATAL and lands in the same place: no baseline, so nothing
        # is called new, so nothing blocks. That is deliberate. A repository we cannot build a
        # baseline for must not have its builds fail over our inability to build one.
        #
        # The awkward part is history. Your checkout is usually shallow -- actions/checkout
        # defaults to fetch-depth 1 -- and a merge base cannot be computed from one commit. We
        # deepen it ourselves rather than asking you to change your checkout, because a scanner
        # that requires fetch-depth: 0 to work is a scanner that silently does less for everyone
        # who did not read that far.
        # Only ask for a baseline if the PINNED scanner understands it. action.yml and pins.env
        # are two files that move independently, and the scanner rejects an unknown flag outright
        # -- so an action newer than its pin would fail every pull request with
        # "flag provided but not defined". Checking costs one --help and removes the ordering
        # constraint entirely: this file can ship before or after the scanner release, in either
        # order, and a customer pinned to an older scanner simply gets no baseline.
        SUPPORTS_BASELINE=""
        if "${WORK}/visiblaze-scan" --help 2>&1 | grep -q -- "-base-dir"; then
          SUPPORTS_BASELINE="yes"
        fi

        if [ -n "${BASE_SHA}" ] && [ "${DRY_RUN}" != "true" ] && [ -n "${SUPPORTS_BASELINE}" ]; then
          BASE_WORKTREE="${WORK}/base"
          if git -C "${GITHUB_WORKSPACE}" rev-parse --git-dir >/dev/null 2>&1; then
            # A pull-request checkout is shallow by default -- actions/checkout uses fetch-depth 1 --
            # and a merge base cannot be computed from one commit on each side. Deepen first, then
            # ask. Each step's error is CAPTURED rather than discarded: the first version of this
            # sent stderr to /dev/null and reported only "could not resolve a merge base", which
            # said nothing about which of four different causes it was.
            GITERR=""
            if ! git -C "${GITHUB_WORKSPACE}" fetch --no-tags --quiet --depth=200 \
                   origin "+${BASE_SHA}:refs/visiblaze/base" 2>"${WORK}/git.err"; then
              GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"
              # A server that will not serve an arbitrary SHA still serves the branch it is on.
              if ! git -C "${GITHUB_WORKSPACE}" fetch --no-tags --quiet --depth=200 \
                     origin "${BASE_REF}" 2>"${WORK}/git.err"; then
                GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"
              else
                GITERR=""
              fi
            fi
            # Deepen the HEAD side too, or the two histories still never meet.
            git -C "${GITHUB_WORKSPACE}" fetch --no-tags --quiet --deepen=200 2>/dev/null || true

            MERGE_BASE="$(git -C "${GITHUB_WORKSPACE}" merge-base HEAD "${BASE_SHA}" 2>"${WORK}/git.err" || true)"
            if [ -z "${MERGE_BASE}" ]; then
              # On a pull_request event HEAD is refs/pull/N/merge, whose FIRST parent is the base
              # side of that merge. Weaker than a true merge base -- it can call a finding new that
              # was fixed on the base since this branch was cut -- so it is a fallback, not the
              # primary, and it is only reached when the histories genuinely will not meet.
              MERGE_BASE="$(git -C "${GITHUB_WORKSPACE}" rev-parse --verify --quiet 'HEAD^1' 2>/dev/null || true)"
              [ -n "${MERGE_BASE}" ] && echo "visiblaze-sast: no common history with the base; comparing against the merge commit's base parent instead"
            fi
            [ -z "${MERGE_BASE}" ] && [ -z "${GITERR}" ] && GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"
            if [ -n "${MERGE_BASE}" ] \
               && git -C "${GITHUB_WORKSPACE}" worktree add --detach --quiet "${BASE_WORKTREE}" "${MERGE_BASE}" 2>/dev/null; then
              # The baseline must be the SAME SUBTREE, or a monorepo job comparing its package
              # against the whole repository would call every finding outside its package "new"
              # and then block on them. SCAN_DIR is under the workspace, so its suffix maps
              # directly onto the worktree.
              BASE_SCAN_DIR="${BASE_WORKTREE}${SCAN_DIR#${GITHUB_WORKSPACE}}"
              if [ -d "${BASE_SCAN_DIR}" ]; then
                echo "visiblaze-sast: comparing against merge base ${MERGE_BASE}"
                ARGS+=(--base-dir "${BASE_SCAN_DIR}")
              else
                # The path did not exist on the base -- a newly added package. Everything in it is
                # genuinely new, but saying so with an empty baseline would be a guess dressed as
                # a measurement, so this reports and does not block.
                echo "visiblaze-sast: '${IN_PATH}' does not exist at the merge base, so this is a new subtree; nothing will block"
              fi
            else
              echo "visiblaze-sast: could not resolve a merge base, so no finding can be shown to be new; nothing will block${GITERR:+ (git: ${GITERR})}"
            fi
          else
            echo "visiblaze-sast: no git history available, so no finding can be shown to be new; nothing will block"
          fi
        fi

        set +e
        "${WORK}/visiblaze-scan" "${ARGS[@]}"
        RC=$?
        set -e

        # Exit codes are distinct on purpose and must not be flattened here. 2 means the code has
        # a problem the caller asked to block on; 1 means the tool has a problem. A pipeline that
        # cannot tell those apart learns to ignore both.
        case "$RC" in
          0)
            echo "status=$([ "${DRY_RUN}" = "true" ] && echo dry-run || echo sent)" >> "$GITHUB_OUTPUT"
            echo "policy=$([ -n "${IN_FAIL_ON}" ] && echo pass || echo not-applied)" >> "$GITHUB_OUTPUT"
            ;;
          2)
            echo "status=$([ "${DRY_RUN}" = "true" ] && echo dry-run || echo sent)" >> "$GITHUB_OUTPUT"
            echo "policy=fail" >> "$GITHUB_OUTPUT"
            # Exit 2 has two causes and they are not interchangeable: the caller's own --fail-on
            # threshold, and the tenant policy the platform sends back with the ingest response.
            # Which one fired is knowable here without asking the scanner, because --fail-on is
            # only ever passed when IN_FAIL_ON is set - so an empty threshold at exit 2 can only
            # be the policy.
            #
            # This mattered more than a wording nit. `::error::` is what GitHub surfaces on the
            # pull request, so when the policy blocked, the ONLY message a reviewer saw was
            # "findings at or above '' are present" - an empty threshold, attributed to the
            # wrong decision-maker - while the scanner's accurate sentence stayed in the log.
            if [ -n "${IN_FAIL_ON}" ]; then
              echo "::error::visiblaze-sast: findings at or above '${IN_FAIL_ON}' are present"
            else
              echo "::error::visiblaze-sast: this change introduced findings your organisation's pull-request policy blocks on - the run log names them and says which are new"
            fi
            exit 2
            ;;
          *)
            bail warning "the scan did not complete (exit ${RC})"
            ;;
        esac
